spring.application.name=ms-notification
server.port=${SERVER_PORT:8084}

# RabbitMQ Configuration (Aula 07 - Integracao por Mensageria)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
rabbitmq.queue=${RABBITMQ_QUEUE:echobox.notifications}

# SMTP / MailHog Configuration (Microsservico de Suporte: E-mail - Aula 02 Slide 23)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
