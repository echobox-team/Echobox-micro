events {
    worker_connections 1024;
}

http {
    upstream ms_auth {
        server ms-auth:8081;
    }

    upstream ms_company {
        server ms-company:8082;
    }

    upstream ms_feedback {
        server ms-feedback:8083;
    }

    upstream ms_notification {
        server ms-notification:8084;
    }

    server {
        listen 8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        location /users {
            proxy_pass http://ms_auth;
        }

        location /companies {
            proxy_pass http://ms_company;
        }

        location /categories {
            proxy_pass http://ms_company;
        }

        location /statuses {
            proxy_pass http://ms_company;
        }

        location /feedbacks {
            proxy_pass http://ms_feedback;
        }

        location /replies {
            proxy_pass http://ms_feedback;
        }

        location /notifications {
            proxy_pass http://ms_notification;
        }
    }
}
